<title>FIRST MARKS — an open-air gallery of the world’s petroglyphs</title>

<style>
:root{
  --night:#16121e;      /* dusk sky, just above the rim */
  --peck:#ecdfc6;       /* a fresh hammer strike */
  --peck-dim:#b9ad97;
  --dust:#8e8597;
  --ochre:#d9a95f;      /* sconce light */
  --varnish:#2a211b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--night)}
body{font-family:var(--serif);color:var(--peck);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
canvas.gl{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{display:inline-block;min-width:1.7em;padding:0 .45em;margin:0 .1em;border:1px solid rgba(236,223,198,.38);border-bottom-width:2px;border-radius:5px;font:600 11px/1.6 var(--sans);text-align:center;color:var(--peck);background:rgba(236,223,198,.07);vertical-align:1px}

/* ---- title veil: the live scene shows through ---- */
#intro{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:0 24px clamp(44px,11vh,120px);background:linear-gradient(180deg,rgba(22,18,30,.1) 0%,rgba(22,18,30,.2) 50%,rgba(12,10,18,.88) 100%);pointer-events:auto;cursor:pointer;transition:opacity .8s ease;z-index:5}
#intro.gone{opacity:0;pointer-events:none}
.intro-inner{max-width:640px;display:flex;flex-direction:column;align-items:center}
#intro h1{margin:0 0 14px;line-height:0}
#peck{display:block;width:min(520px,84vw);height:clamp(70px,10vw,112px);filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
#intro .sub{font-size:clamp(16px,1.5vw,19px);line-height:1.5;color:var(--peck-dim);font-style:italic;max-width:34em;margin-bottom:26px;text-shadow:0 1px 10px rgba(0,0,0,.8)}
#enter{all:unset;cursor:pointer;font:400 13px/1 var(--serif);letter-spacing:.32em;text-transform:uppercase;color:var(--peck);padding:6px 0 9px .32em;background:radial-gradient(circle,currentColor 1px,transparent 1.4px) 0 100%/7px 3px repeat-x;text-shadow:0 1px 10px rgba(0,0,0,.9);animation:ember 3.2s ease-in-out infinite;transition:color .3s}
@keyframes ember{50%{opacity:.62}}
#intro:hover #enter,#enter:focus-visible{color:var(--ochre);animation:none;text-shadow:0 0 14px rgba(217,169,95,.55),0 1px 10px rgba(0,0,0,.9)}
#intro .sound{margin-top:14px;font:12px/1.4 var(--sans);color:var(--dust)}

/* ---- HUD ---- */
#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(236,223,198,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:rgba(18,14,24,.62);border-radius:999px;padding:8px 16px;font:14px/1.4 var(--sans);color:var(--peck);white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
#prompt{bottom:12%}
#prompt i{font-family:var(--serif);font-size:15px}
#hint{bottom:calc(12% + 52px);background:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--peck-dim);text-shadow:0 1px 8px rgba(0,0,0,.9);transition:opacity .8s}
#prompt.on,#hint.on{opacity:1}
#region{position:absolute;top:10%;left:0;right:0;text-align:center;opacity:0;transition:opacity 1s;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.85)}
#region .rname{font-size:clamp(24px,3vw,34px);letter-spacing:.01em;color:var(--peck)}
#region .rsub{font-style:italic;font-size:15px;color:var(--peck-dim);margin-top:4px}
#region.on{opacity:1}
#toast{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);font-style:italic;font-size:17px;color:var(--peck);text-shadow:0 2px 12px rgba(0,0,0,.95);opacity:0;transition:opacity .5s;text-align:center;max-width:min(60ch,88vw);pointer-events:none}
#toast.on{opacity:1}
#drink{position:absolute;left:22px;bottom:22px;background:rgba(18,14,24,.62);border-radius:12px;padding:10px 14px;font:13px/1.4 var(--sans);color:var(--peck-dim);display:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#drink .dname{font-family:var(--serif);color:var(--peck);font-size:16px}
#drink .dhint{margin-top:3px}
#mute{position:absolute;right:22px;top:20px;font:12px var(--sans);color:var(--dust);opacity:0;transition:.4s}
#mute.on{opacity:1}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(140,52,14,.38) 100%);opacity:0;transition:opacity .45s;pointer-events:none}
#vign.on{opacity:1}
#dim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,14,0) 30%,rgba(10,8,14,.55) 70%);opacity:0;transition:opacity .35s;pointer-events:none}
#dim.on{opacity:1;pointer-events:auto;cursor:pointer}

/* ---- the reading card: beside the stone, not over it ---- */
#card{position:absolute;top:0;right:0;bottom:0;width:min(440px,92vw);overflow-y:auto;overscroll-behavior:contain;padding:clamp(28px,7vh,72px) 36px 28px 38px;background:rgba(21,17,26,.9);-webkit-backdrop-filter:blur(14px) saturate(.8);backdrop-filter:blur(14px) saturate(.8);border-left:1px solid rgba(236,223,198,.1);color:var(--peck);opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .28s ease,transform .28s ease;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:rgba(236,223,198,.2) transparent}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .where{font:13px/1.4 var(--sans);color:var(--ochre);margin-bottom:10px}
#card h2{font-size:30px;line-height:1.15;font-weight:400;letter-spacing:-.005em;text-wrap:balance}
#card .titlesub{font-style:italic;color:var(--peck-dim);font-size:15px;line-height:1.45;margin-top:6px}
#card .facts{font:13px/1.5 var(--sans);color:var(--dust);margin-top:10px}
#card .photo{margin:20px 0 0}
#card .photo img{display:block;width:100%;max-height:46vh;object-fit:contain;border-radius:2px}
#card .body{font-size:17px;line-height:1.62;color:#e4d8c1}
#card .body p+p{margin-top:.8em}
#card .lede{margin-top:22px;padding-top:20px;border-top:1px solid rgba(236,223,198,.12)}
#card details{margin-top:18px}
#card details>.body{margin-top:-2px}
#card .unfolded>.body p{margin-top:.8em}
#card summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font:14px/1 var(--sans);color:var(--peck);padding:9px 14px 9px 12px;border:1px solid rgba(236,223,198,.24);border-radius:999px;margin-bottom:18px;transition:background .2s,border-color .2s}
#card summary::-webkit-details-marker{display:none}
#card summary::before{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
#card details[open] summary::before{transform:translateY(1px) rotate(-135deg)}
#card summary:hover,#card summary:focus-visible{background:rgba(236,223,198,.08);border-color:rgba(236,223,198,.45);outline:none}
#card details:not([open]) .less,#card details[open] .more{display:none}
#card details[open] summary{order:9}
#card .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:22px 0 0;padding-top:16px;border-top:1px solid rgba(236,223,198,.12);font:13px/1.5 var(--sans)}
#card .meta dt{color:var(--dust)}
#card .meta dd{color:var(--peck-dim)}
#card .src{margin-top:16px;font:12.5px/1.55 var(--sans);color:var(--dust)}
#card .src.credit{margin-top:8px;font-size:12px}
#card a{color:var(--ochre);text-decoration:underline;text-decoration-color:rgba(217,169,95,.45);text-underline-offset:3px}
#card a:hover{text-decoration-color:currentColor}
#card .close{all:unset;cursor:pointer;margin-top:auto;padding-top:22px;align-self:flex-start;font:12px/1 var(--sans);color:var(--dust)}
#card .close:hover,#card .close:focus-visible{color:var(--peck)}

#err{position:absolute;top:0;left:0;right:0;background:#5c1010;color:#ffd9d9;font:12px/1.5 monospace;padding:10px 14px;display:none;white-space:pre-wrap;z-index:99;pointer-events:auto}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid rgba(236,223,198,.3);background:rgba(18,14,24,.22);opacity:0;transition:opacity .2s;pointer-events:none;--kx:0px;--ky:0px}
#stick::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(236,223,198,.42);transform:translate(var(--kx),var(--ky))}
#stick.on{opacity:1}
#tbtns{position:absolute;right:18px;bottom:22px;display:none;gap:10px;flex-direction:column;align-items:flex-end;pointer-events:auto}
#tbtns button{width:54px;height:54px;border-radius:50%;border:1px solid rgba(236,223,198,.35);background:rgba(18,14,24,.5);color:var(--peck);font:600 17px/1 var(--sans);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#tbtns button:first-child{width:70px;height:70px;font-size:21px;background:rgba(217,169,95,.32)}
body.touch #tbtns{display:flex}
body.touch #drink{bottom:auto;top:18px;left:18px}
@media (max-width:700px){
  .pill{white-space:normal;max-width:88vw;text-align:center}
  #prompt{bottom:18%}
  #card{top:auto;left:0;width:auto;max-height:78vh;border-left:0;border-top:1px solid rgba(236,223,198,.12);border-radius:16px 16px 0 0;padding:26px 22px 20px;transform:translateY(24px)}
  #card h2{font-size:25px}
  #dim{background:rgba(10,8,14,.35)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>

],h:.44,pose:"archer",dir:1}),i.human({at:[-1,-.62],h:.38,pose:"archer",dir:1}),i.human({at:[1.5,-.5],h:.4,pose:"archer",dir:-1}),i.poly([[.06,.68],[.3,.68],[.36,.36],[0,.36]],{w:.026,fill:!0}),i.disc([.18,.74],.045,.022),i.line([[.15,.77],[.1,.84]],.02),i.line([[.21,.77],[.26,.84]],.02),i.dots([.5,-.6],7,.12,.014)}},fajada:{title:"The Sun Dagger Spiral",site:"Fajada Butte, Chaco Culture National Historical Park",location:"New Mexico, United States",culture:"Ancestral Puebloan",date:"c. 1000\u20131300 CE",medium:"Pecked spiral behind three sandstone slabs",scale:"True size \u2014 the spiral measures only 34 \xD7 41 cm.",desc:`Behind three leaning slabs high on Fajada Butte, a 9\xBD-turn spiral hides from the sun \u2014 except near midday on the summer solstice, when a single dagger of light slides down and cleanly bisects it. A smaller companion spiral to the left marks the equinoxes. Documented by artist Anna Sofaer in 1977, it is among the clearest ancient astronomical instruments in stone; the butte has been closed since 1989, after foot traffic shifted the slabs.

Stay a moment \u2014 here, the dagger returns every few minutes.`,source:"Sofaer, Zinser & Sinclair, Science 206 (1979)",pw:.95,ph:.95,bw:2,bh:2,bd:1.6,style:"varnish2",seed:12,dagger:!0,draw(i){i.spiral([.06,.02],{turns:9.5,r0:.006,r1:.195,w:.0135}),i.spiral([-.3,-.12],{turns:2.6,r0:.004,r1:.055,w:.012,ccw:!0}),i.dots([-.28,.3],4,.05,.011)}},"three-rivers":{title:"The Goggle-Eyed Mask & the Pierced Bighorn",site:"Three Rivers Petroglyph Site",location:"New Mexico, United States",culture:"Jornada Mogollon",date:"c. 200\u20131450 CE",medium:"Pecked into basalt boulders",scale:"Figures approximately 1:1.",desc:"More than 21,000 glyphs crowd this basalt ridge above the Tularosa Basin. Two of its most arresting motifs meet here: a round goggle-eyed mask \u2014 its wide-ringed eyes sometimes compared to Mesoamerican rain-deity imagery \u2014 and a bighorn sheep run through by arrows, observed so precisely that the fletching still reads after many centuries.",source:"U.S. Bureau of Land Management, Three Rivers Petroglyph Site",pw:1.6,ph:1.9,bw:2.5,bh:3.1,bd:2,style:"darkBasalt",seed:13,draw(i){i.poly([[-.26,.78],[.26,.78],[.3,.32],[-.3,.32]],{w:.026});for(let e of[-.13,.13])i.circle([e,.62],.085,{w:.022}),i.circle([e,.62],.042,{w:.02});i.zig([-.2,.78],[.2,.78],6,.03,.02),i.dots([0,.4],3,.05,.014);for(let e of[-.12,0,.12])i.line([[e,.32],[e,.24]],.018);i.quad({at:[-.05,-.35],L:.8,dir:1,fill:!0,horn:"curl",hornSize:.36,w:.028});for(let[e,t,n,s]of[[.42,.15,.05,-.22],[.6,0,.25,-.3]])i.line([[e,t],[n,s]],.016),i.line([[e,t],[e+.05,t+.015]],.013),i.line([[e,t],[e+.045,t-.03]],.013);for(let e=0;e<4;e++)i.line([[.42+e*.07,-.62],[.42+e*.07,-.86]],.016);i.line([[.42,-.62],[.63,-.62]],.016),i.line([[.42,-.86],[.63,-.86]],.016)}},"sand-island":{title:"The Flute Players",site:"Sand Island petroglyph panel, San Juan River",location:"Bears Ears region, Utah, United States",culture:"Basketmaker\u2013Pueblo III, with later Ute and Navajo additions",date:"c. 800 BCE \u2013 historic period",medium:"Pecked through desert varnish on sandstone",scale:"Figures approximately 1:1.",desc:"Reclining, hump-backed figures raise flutes above a river that has carried people for three thousand years. Figures like these are often called 'Kokopelli' after the Hopi katsina Kookop\xF6l\xF6 \u2014 a modern conflation the Hopi Cultural Preservation Office discourages; the flute player is older, and belongs to many stories. Around the players drift spirals, sheep, and the layered signatures of thirty centuries.",source:"Bears Ears Partnership site guide; Hopi Cultural Preservation Office",pw:2.6,ph:1.6,bw:3.6,bh:2.8,bd:2.2,style:"varnish",seed:14,draw(i){i.human({at:[-.8,-.15],h:.52,pose:"flute"}),i.human({at:[0,.1],h:.58,pose:"flute"}),i.human({at:[.72,-.3],h:.46,pose:"flute"}),i.spiral([1,.38],{turns:3.4,r0:.01,r1:.2,w:.022}),i.quad({at:[-1.12,.42],L:.3,dir:-1,fill:!0,horn:"curl",hornSize:.13,w:.02}),i.quad({at:[-.5,.5],L:.26,dir:1,fill:!0,horn:"curl",hornSize:.11,w:.02}),i.dots([.4,-.55],6,.1,.013)}},"toro-muerto":{title:"Beasts, Birds & Dancers",site:"Toro Muerto",location:"Arequipa, Peru",culture:"Associated with the Wari era",date:"c. 500\u20131000 CE",medium:"Pecked into volcanic boulders",scale:"Figures approximately 1:1.",desc:`Across a desert gorge, some 2,600 carved boulders make Toro Muerto one of the largest rock-art complexes on Earth. Its signature figure is the danzante \u2014 a dancer with one arm raised, one lowered, head crowned with zigzag rays. A 2024 study argues that the zigzags and dotted lines swirling around the dancers may notate songs and the geometric visions of ritual: music, drawn.

 modern brewers have recreated it. Sip and consider: someone raised a cup like this before writing existed.",source:"McGovern et al., PNAS 101 (2004)",notes:["Soft honey sweetness with a tart hawthorn edge.","Nine thousand years of aftertaste.","Somewhere, a Neolithic villager toasts you back."]},{id:"chaco",shape:"cylinder",name:"Chaco cylinder jar",drink:"Frothed cacao",otitle:"Chocolate, Two Thousand Kilometres from Home",meta:[["VESSEL","Cylinder jar, white slip & black hatching \u2014 after Pueblo Bonito"],["CONTENTS","Frothed ceremonial cacao"],["VINTAGE","c. 1000\u20131125 CE"]],body:"Traces of theobromine \u2014 the fingerprint molecule of cacao \u2014 line cylinder jars from Pueblo Bonito, Chaco Canyon. The nearest cacao tree grew two thousand kilometres south: proof of trade routes carrying chocolate from Mesoamerica into the Ancestral Puebloan world, and of a bitter, frothed drink poured in the great houses a thousand years ago.",source:"Crown & Hurst, PNAS 106 (2009)",notes:["Bitter, frothy, a ghost of chile.","Worth walking two thousand kilometres for.","The froth is the point \u2014 pour from a height."]},{id:"qero",shape:"qero",name:"Inca qero",drink:"Chicha de jora (maize beer)",otitle:"Drink With Both Hands",meta:[["VESSEL","Flared beaker (qero), banded geometry \u2014 Inca form"],["CONTENTS","Chicha de jora \u2014 sprouted-maize beer"],["VINTAGE","A living Andean tradition"]],body:"Chicha de jora is beer brewed from maize that has been sprouted, ground and fermented. Under the Inca, specialist brewers \u2014 among them the aqllakuna, the chosen women \u2014 made it in quantity, and qeros were kept in matched pairs: to toast is to drink together, never alone. Chicha is still brewed across the Andes; a red flag over a doorway means the batch is ready. Pour a splash for Pachamama first.",source:"Colonial chronicles (Guaman Poma); living tradition",notes:["Earthy, lightly sour, alive.","Qeros come in pairs \u2014 never toast alone.","A splash for Pachamama, always."]},{id:"pulque",shape:"cup",name:"Pulque cup",drink:"Pulque (octli) \u2014 fermented agave sap",otitle:"The Drink of Four Hundred Rabbits",meta:[["VESSEL","Footed cup, black-on-orange \u2014 after Aztec polychrome"],["CONTENTS","Pulque \u2014 fermented aguamiel of the maguey"],["VINTAGE","Mesoamerican tradition, millennia deep"]],body:"Tap the heart of a maguey and its sweet sap ferments, milky and quick, into pulque \u2014 sacred to Mayahuel, goddess of the plant, and to the Centzon Totochtin, her four hundred rabbit children of drunkenness: the count, it was said, of all the ways a drinker can be drunk. Under Aztec law everyday drinking was restricted to elders and ritual; pulquer\xEDas still pour it across central Mexico.",source:"Aztec ethnohistory (Sahag\xFAn); living tradition",notes:["Milky, tangy, gently fizzy.","You are currently three rabbits deep.","Mayahuel sends her regards."]},{id:"wari",shape:"kero",name:"Wari kero",drink:"Chicha de molle (peppertree brew)",otitle:"The Brewery on the Mesa",meta:[["VESSEL","Tall polychrome kero \u2014 after Cerro Ba\xFAl, Peru"],["CONTENTS","Chicha de molle \u2014 pink-peppertree berry brew"],["VINTAGE","c. 600\u20131000 CE"]],body:"On the mesa of Cerro Ba\xFAl the Wari empire ran a brewery whose brewers were high-status women \u2014 their fine shawl pins were found beside the vats. The house specialty: chicha brewed from the pink berries of the molle tree. When the outpost was abandoned around 1000 CE the brewery was ceremonially burned and the drinking vessels smashed into the embers. Last call, performed as ritual.",source:"Moseley et al., PNAS 102 (2005)",notes:["Pink-peppercorn bright, resinous, warm.","Brewed by the finest brewers of an empire.","Drink one for the brewery that burned."]}],zl=[{id:"maize",title:"Maize",sub:"the grass that fed a hemisphere",body:"Domesticated from teosinte \u2014 a wiry grass with a dozen hard seeds \u2014 in Mexico's Balsas valley around 9,000 years ago. The great unlock was nixtamalization: simmering kernels with lime or ash frees their niacin and makes masa possible. Blue, red, white, gold: the ears on this table are one species' argument that agriculture is an art form.",source:"Piperno et al., PNAS 106 (2009)"},{id:"squash",title:"Squash",sub:"the eldest sister",body:"Squash seeds from Guil\xE1 Naquitz cave in Oaxaca are about 10,000 years old \u2014 among the oldest domesticated plants anywhere in the Americas, older than maize itself. In the Three Sisters field its broad leaves shade the soil and hold the moisture; its flesh keeps through winter.",source:"Smith, Science 276 (1997)"},{id:"beans",title:"Beans",sub:"the generous sister",body:"Common beans were domesticated at least twice, independently, in Mesoamerica and the Andes. Planted with maize and squash they climb the stalks and fix nitrogen into the soil \u2014 feeding the field that feeds you. Together, the Three Sisters make a complete protein.",source:"Smithsonian National Museum of the American Indian"},{id:"amaranth",title:"Amaranth",sub:"the grain that was nearly lost",body:"Huauhtli fed the Aztec state \u2014 tribute lists demanded it by the granary. Mixed into tzoalli dough it was shaped into figures of the gods and eaten in ceremony, which is why its cultivation was restricted under colonial rule; the grain survived at the field margins. Popped, it still crackles like tiny fireworks.",source:"Sauer, The Grain Amaranths (1967)"},{id:"quinoa",title:"Quinoa",sub:"chisiya mama \u2014 the mother grain",body:"Domesticated in the Titicaca basin, quinoa packs a complete protein into a seed the size of a pinhead and thrives at altitudes where maize gives up. The Quechua name says the rest: chisiya mama, the mother grain.",source:"Pearsall (2008)"},{id:"cacao",title:"Cacao",sub:"currency you can drink",body:"The oldest traces of cacao come not from the Maya lowlands but from Mayo-Chinchipe sites in Amazonian Ecuador, 5,300 years ago. By Aztec times the beans were money \u2014 counterfeiters filled empty husks with clay. Ground, frothed and spiced, kakaw was a drink of rulers long before it was anyone's candy.",source:"Zarrillo et al., Nature Ecology & Evolution 2 (2018)"},{id:"manoomin",title:"Manoomin \u2014 wild rice",sub:"the food that grows on water",body:"For the Anishinaabe, manoomin is at the heart of the migration story: travel until you find the food that grows on water. Harvested by canoe \u2014 one person poling, one knocking ripe grain into the hull \u2014 it is a living, protected tradition, tended today as it has been for centuries.",source:"Anishinaabe tradition; Great Lakes Indian Fish & Wildlife Commission"},{id:"chile",title:"Chile",sub:"the first spice of the Americas",body:"Chile peppers were being gathered and grown in Mexico seven to nine thousand years ago; by 1492 dozens of cultivated forms ran from fruity to ferocious. They then conquered every cuisine on Earth within about a century \u2014 the fastest culinary conquest in history.",source:"Perry et al., Science 315 (2007)"}],Em={maize:{bite:"a roasted ear of blue maize",soft:!1,notes:["Smoky, nutty, sweet at the tip.","Nixtamal-soft kernels, charred at the edges.","Nine thousand years of plant breeding, gone in three bites."]},squash:{bite:"a wedge of fire-roasted squash",soft:!0,notes:["Sweet and buttery, a little caramel at the skin.","Soft as custard where the embers reached it.","The eldest sister, finished."]},beans:{bite:"a little bowl of stewed beans",soft:!0,notes:["Earthy, creamy, a bay-leaf warmth.","The generous sister gives again.","Scraped clean."]},amaranth:{bite:"a honey-amaranth alegr\xEDa",soft:!1,notes:["Crisp popped seed, bound with honey.","Like a very old granola bar.","Alegr\xEDa means joy. Fair."]},quinoa:{bite:"a bowl of warm quinoa",soft:!0,notes:["Nutty, with a tiny pop to every grain.","Mild and grassy \u2014 mother-grain comfort.","Every last seed."]},cacao:{bite:"a roasted cacao bean",soft:!1,notes:["Bitter first \u2014 then fruit, then smoke.","No sugar at all. The ancestors were brave.","Your mouth is now very awake."]},manoomin:{bite:"a bowl of parched manoomin",soft:!1,notes:["Toasty and smoky, faintly of lake water.","Long dark grains, each one hand-knocked into a canoe.","Miigwech."]},chile:{bite:"a dried red chile",soft:!1,notes:["Fruity \u2014 oh. Oh, there it is.","The heat climbs slowly up the back of your throat.","Worth it. Probably."]}};for(let i of zl)Object.assign(i,Em[i.id]);var sc={where:"About the gallery",title:"First Marks",titlesub:"An open-air gallery of the world's petroglyphs",meta:[["EXHIBITS","21 engraved stones \xB7 6 regional groves \xB7 1 field-notes grove"],["THE HEARTH","5 ancient drinks \xB7 8 founding foods"],["HOURS","Perpetual dusk. The sconces are always lit."]],body:`Every engraving here is carved from an openly licensed photograph or drawing of a real petroglyph \u2014 extracted by image processing, credited on its label \u2014 at or near its published scale, with its site, culture and sources on the lectern beside it; the few with no usable image are careful hand redrawings. (A petroglyph is pecked or carved into rock; a painted image is a pictograph.) The boulders are not the real stones \u2014 the originals belong to their landscapes and to the living peoples whose heritage they are.
